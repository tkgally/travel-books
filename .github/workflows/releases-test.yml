# TEMPORARY (2026-11-23): tries tools/releases.py against the real GitHub API on the session branch, under the tag
# prefix "test-", then deletes the test release. Removed before the branch is merged.
name: Test the release upload
on:
  push:
    branches: [claude/vigilant-hamilton-s1r0qi]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SLUG: aloha-chaney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet Pillow
      - name: Build one book
        run: python3 tools/build_site.py --out _t --only "$SLUG"
      - name: First upload
        run: python3 tools/releases.py _t --upload --tag-prefix test- --only "$SLUG" | tee first.txt && grep -q "^2 files uploaded" first.txt
      - name: Downloads match the built files
        run: |
          v=$(python3 -c "import json;print(json.load(open('_t/books/$SLUG/$SLUG.json'))['version'])")
          for ext in epub odt; do
            curl -sSfL -o "got.$ext" "https://github.com/$GITHUB_REPOSITORY/releases/download/test-$SLUG/$SLUG-v$v.$ext"
            cmp "got.$ext" "_t/books/$SLUG/$SLUG.$ext" && echo "$ext: same bytes"
          done
      - name: Nothing to upload the second time
        run: python3 tools/releases.py _t --upload --tag-prefix test- --only "$SLUG" | tee second.txt && grep -q "^0 files uploaded" second.txt
      - name: A changed file is replaced
        run: |
          printf 'x' >> "_t/books/$SLUG/$SLUG.odt"
          python3 tools/releases.py _t --upload --tag-prefix test- --only "$SLUG" | tee third.txt && grep -q "^1 files uploaded" third.txt
          v=$(python3 -c "import json;print(json.load(open('_t/books/$SLUG/$SLUG.json'))['version'])")
          size=$(stat -c %s "_t/books/$SLUG/$SLUG.odt")
          got=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/test-$SLUG" \
                | python3 -c "import json,sys;print([a['size'] for a in json.load(sys.stdin)['assets'] if a['name']=='$SLUG-v$v.odt'])")
          echo "release record: $got, local: $size"
          [ "$got" = "[$size]" ]
          # The download address may serve the old bytes for a while (a cache): report how long, do not fail on it.
          for i in $(seq 1 30); do
            curl -sSfL -o got2.odt "https://github.com/$GITHUB_REPOSITORY/releases/download/test-$SLUG/$SLUG-v$v.odt"
            if cmp -s got2.odt "_t/books/$SLUG/$SLUG.odt"; then echo "download replaced after about $((i * 10)) s"; break; fi
            sleep 10
          done
      - name: Remove from the site
        run: python3 tools/releases.py _t --remove && ! ls _t/books/$SLUG/*.epub 2>/dev/null
      - name: Delete the test release
        if: always()
        run: python3 tools/releases.py --delete-prefix test-
